name: Apply Sangyeok-dong location fix

on:
  push:
    paths:
      - '.github/workflows/fix-sangyeok.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Sangyeok-dong geocoding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tennis_weather.py')
          text = path.read_text(encoding='utf-8')

          old = '''@st.cache_data(ttl=86400, show_spinner=False)\ndef geocode(location: str):\n    candidates = _location_candidates(location)\n'''

          new = '''@st.cache_data(ttl=86400, show_spinner=False)\ndef geocode(location: str):\n    normalized = " ".join(location.strip().split())\n\n    # 산격동은 동명 지역 오선택을 막기 위해 정확한 행정구역으로 고정한다.\n    # 날씨 조회에는 산격동 내부의 대표 좌표를 사용한다.\n    sangyeok_aliases = {\n        "대구광역시 북구 산격동",\n        "대구 북구 산격동",\n        "북구 산격동",\n        "산격동",\n    }\n    if normalized in sangyeok_aliases:\n        return 35.8998232, 128.6063565, "대구광역시 북구 산격동"\n\n    candidates = _location_candidates(location)\n'''

          if old not in text:
              raise SystemExit('geocode insertion point not found')

          text = text.replace(old, new, 1)
          text = text.replace('v0.9.2 — Open-Meteo 기반', 'v0.9.3 — Open-Meteo 기반')
          text = text.replace('Tennis Time Weather v0.9.2 — Open-Meteo 기반', 'Tennis Time Weather v0.9.3 — Open-Meteo 기반')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify syntax
        run: python -m py_compile tennis_weather.py

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tennis_weather.py
          git commit -m "Fix Sangyeok-dong location resolution"
          git push
